<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#21262d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="url(#bg)" rx="10"/>

  <!-- Subtle grid lines -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- ── Pipeline diagram (right side) ── -->

  <!-- Connector lines -->
  <!-- Task → Base -->
  <line x1="518" y1="100" x2="538" y2="100" stroke="#30363d" stroke-width="1.5"/>
  <!-- Base → INV -->
  <line x1="568" y1="96" x2="584" y2="80" stroke="#30363d" stroke-width="1.5"/>
  <!-- Base → DOM -->
  <line x1="568" y1="104" x2="584" y2="120" stroke="#30363d" stroke-width="1.5"/>
  <!-- INV → Compose -->
  <line x1="626" y1="78" x2="642" y2="93" stroke="#30363d" stroke-width="1.5"/>
  <!-- DOM → Compose -->
  <line x1="626" y1="122" x2="642" y2="107" stroke="#30363d" stroke-width="1.5"/>
  <!-- Compose → Select -->
  <line x1="688" y1="100" x2="708" y2="100" stroke="#30363d" stroke-width="1.5"/>
  <!-- Select → Library -->
  <line x1="748" y1="100" x2="768" y2="100" stroke="#30363d" stroke-width="1.5"/>

  <!-- Accent glow on active connectors -->
  <line x1="518" y1="100" x2="538" y2="100" stroke="url(#accent)" stroke-width="1" opacity="0.5" filter="url(#subtle-glow)"/>
  <line x1="688" y1="100" x2="708" y2="100" stroke="url(#accent)" stroke-width="1" opacity="0.5" filter="url(#subtle-glow)"/>
  <line x1="748" y1="100" x2="768" y2="100" stroke="url(#accent)" stroke-width="1" opacity="0.5" filter="url(#subtle-glow)"/>

  <!-- Arrowheads -->
  <polygon points="538,97 538,103 544,100" fill="#30363d"/>
  <polygon points="584,77 584,83 590,80" fill="#30363d"/>
  <polygon points="584,117 584,123 590,120" fill="#30363d"/>
  <polygon points="642,90 642,96 648,93" fill="#30363d"/>
  <polygon points="642,104 642,110 648,107" fill="#30363d"/>
  <polygon points="708,97 708,103 714,100" fill="#30363d"/>
  <polygon points="768,97 768,103 774,100" fill="#30363d"/>

  <!-- Node: Task -->
  <rect x="490" y="86" width="28" height="28" rx="5" fill="url(#node-grad)" stroke="#3fb950" stroke-width="1.2" filter="url(#subtle-glow)"/>
  <text x="504" y="104" font-family="monospace" font-size="7" fill="#3fb950" text-anchor="middle">TASK</text>

  <!-- Node: Base -->
  <rect x="538" y="86" width="30" height="28" rx="5" fill="url(#node-grad)" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="553" y="104" font-family="monospace" font-size="7" fill="#58a6ff" text-anchor="middle">BASE</text>

  <!-- Node: INV -->
  <rect x="584" y="65" width="42" height="22" rx="5" fill="url(#node-grad)" stroke="#e3b341" stroke-width="1.2"/>
  <text x="605" y="79" font-family="monospace" font-size="7" fill="#e3b341" text-anchor="middle">INV</text>

  <!-- Node: DOM -->
  <rect x="584" y="113" width="42" height="22" rx="5" fill="url(#node-grad)" stroke="#f78166" stroke-width="1.2"/>
  <text x="605" y="127" font-family="monospace" font-size="7" fill="#f78166" text-anchor="middle">DOM</text>

  <!-- Node: Compose -->
  <rect x="642" y="86" width="46" height="28" rx="5" fill="url(#node-grad)" stroke="#a5d6ff" stroke-width="1.2"/>
  <text x="665" y="104" font-family="monospace" font-size="7" fill="#a5d6ff" text-anchor="middle">COMPOSE</text>

  <!-- Node: Select -->
  <rect x="708" y="86" width="40" height="28" rx="5" fill="url(#node-grad)" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="728" y="104" font-family="monospace" font-size="7" fill="#d2a8ff" text-anchor="middle">SELECT</text>

  <!-- Node: Library (glowing) -->
  <rect x="768" y="82" width="46" height="36" rx="5" fill="url(#node-grad)" stroke="#3fb950" stroke-width="1.5" filter="url(#glow)"/>
  <text x="791" y="98" font-family="monospace" font-size="6.5" fill="#3fb950" text-anchor="middle">LIBRARY</text>
  <text x="791" y="109" font-family="monospace" font-size="5.5" fill="#3fb950" text-anchor="middle" opacity="0.7">&#x2191; LEARN</text>

  <!-- Loop-back arrow: Library → Task (harnessing-level recursion) -->
  <path d="M 791 118 Q 791 148 504 148 Q 490 148 490 114" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <polygon points="487,114 490,108 493,114" fill="#3fb950" opacity="0.4"/>
  <text x="645" y="162" font-family="monospace" font-size="6" fill="#3fb950" text-anchor="middle" opacity="0.5">harnessing-level recursion</text>

  <!-- ── Left side: title block ── -->

  <!-- Superscript "2" accent bar -->
  <rect x="36" y="44" width="3" height="30" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="48" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Recursive Agent</text>
  <text x="48" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Harness</text>
  <!-- Superscript 2 -->
  <text x="208" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#3fb950" filter="url(#subtle-glow)">²</text>

  <!-- Tagline -->
  <text x="48" y="122" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b949e" letter-spacing="0.2">Propose · Probe · Compose · Learn</text>

  <!-- Badges row -->
  <!-- Python badge -->
  <rect x="48" y="136" width="72" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="84" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">Python 3.11+</text>

  <!-- React badge -->
  <rect x="128" y="136" width="56" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="156" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">React + Vite</text>

  <!-- arXiv badge -->
  <rect x="192" y="136" width="72" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="228" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">arXiv:2610.14224</text>

  <!-- MIT / local badge -->
  <rect x="272" y="136" width="54" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="299" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Local · Ollama</text>

  <!-- Bottom rule -->
  <rect x="36" y="174" width="420" height="1" rx="0.5" fill="url(#accent)" opacity="0.25"/>
</svg>
