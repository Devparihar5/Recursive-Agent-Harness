<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="a-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="a-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <linearGradient id="a-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#388bfd"/>
    </linearGradient>
    <filter id="a-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="a-sglow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#484f58"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e3b341"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="900" height="520" fill="url(#a-bg)" rx="12"/>

  <!-- Grid -->
  <g stroke="#21262d" stroke-width="0.4" opacity="0.5">
    <line x1="0" y1="50"  x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
  </g>

  <!-- ═══ TITLE ═══ -->
  <text x="450" y="34" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE</text>
  <rect x="350" y="40" width="200" height="1.5" rx="1" fill="url(#a-green)" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════
       LOOP 1 BOX — Task-Level Recursion
  ═══════════════════════════════════════════ -->
  <rect x="30" y="58" width="840" height="290" rx="10" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 3"/>
  <rect x="50" y="50" width="190" height="20" rx="4" fill="#161b22"/>
  <text x="58" y="64" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#58a6ff" font-weight="600" letter-spacing="0.5">① TASK-LEVEL RECURSION</text>

  <!-- ─── Row 1: Task input ─── -->
  <!-- Task box -->
  <rect x="56" y="88" width="110" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#a-sglow)"/>
  <text x="111" y="109" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">TASK</text>
  <text x="111" y="124" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">description + sources</text>

  <!-- Arrow: Task → Base Executor -->
  <line x1="166" y1="114" x2="204" y2="114" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Base Executor -->
  <rect x="204" y="88" width="130" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="269" y="108" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#58a6ff" text-anchor="middle">AGENT EXECUTOR</text>
  <text x="269" y="122" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">harnesses/base</text>
  <text x="269" y="132" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">trajectory · deliverable</text>

  <!-- Arrow: Base Executor → Probe Runner (baseline) -->
  <line x1="334" y1="114" x2="374" y2="114" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="354" y="108" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">e₀</text>

  <!-- Probe Runner -->
  <rect x="374" y="88" width="110" height="52" rx="8" fill="#161b22" stroke="#a5d6ff" stroke-width="1.5"/>
  <text x="429" y="108" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#a5d6ff" text-anchor="middle">PROBE RUNNER</text>
  <text x="429" y="122" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">behavioral contrast</text>
  <text x="429" y="132" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">evidence strings</text>

  <!-- ─── Row 2: Editors ─── -->
  <!-- Arrow: Task → Editors -->
  <line x1="111" y1="140" x2="111" y2="172" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="111" y1="172" x2="204" y2="172" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="111" y1="172" x2="204" y2="212" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- InvariantEditor -->
  <rect x="204" y="158" width="130" height="46" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="269" y="176" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#e3b341" text-anchor="middle">INVARIANT EDITOR</text>
  <text x="269" y="190" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">task-agnostic deficiencies</text>
  <text x="269" y="199" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">planning · tools · context</text>

  <!-- DomainEditor -->
  <rect x="204" y="212" width="130" height="46" rx="8" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="269" y="230" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#f78166" text-anchor="middle">DOMAIN EDITOR</text>
  <text x="269" y="244" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">task-specific procedures</text>
  <text x="269" y="253" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">knowledge · constraints</text>

  <!-- Arrows: Editors → Probe Runner -->
  <line x1="334" y1="181" x2="374" y2="150" stroke="#e3b341" stroke-width="1.2" marker-end="url(#arr-yellow)"/>
  <line x1="334" y1="235" x2="374" y2="154" stroke="#f78166" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrow: Probe Runner → Composer -->
  <line x1="484" y1="114" x2="524" y2="114" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="504" y="108" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">probes</text>

  <!-- Composer -->
  <rect x="524" y="88" width="120" height="52" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="584" y="108" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#d2a8ff" text-anchor="middle">COMPOSER</text>
  <text x="584" y="122" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">KEEP · DROP · MERGE</text>
  <text x="584" y="132" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">REVISE per component</text>

  <!-- Arrow: Composer → Successor Executor -->
  <line x1="644" y1="114" x2="684" y2="114" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="664" y="108" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">H′</text>

  <!-- Successor Executor -->
  <rect x="684" y="88" width="130" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="749" y="108" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#58a6ff" text-anchor="middle">AGENT EXECUTOR</text>
  <text x="749" y="122" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">successor harness</text>
  <text x="749" y="132" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">trajectory · deliverable</text>

  <!-- ─── Row 3: Blind Selector ─── -->
  <!-- Arrow: Successor → BlindSelector -->
  <line x1="749" y1="140" x2="749" y2="168" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="757" y="160" font-family="monospace" font-size="7" fill="#6e7681">e′</text>

  <!-- BlindSelector -->
  <rect x="684" y="168" width="130" height="52" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="749" y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#79c0ff" text-anchor="middle">BLIND SELECTOR</text>
  <text x="749" y="202" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">anonymous deliverables</text>
  <text x="749" y="212" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">no harness identity</text>

  <!-- Also arrow from Probe Runner outputs to BlindSelector -->
  <line x1="429" y1="140" x2="429" y2="248" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="429" y1="248" x2="684" y2="194" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- Arrow: BlindSelector → output -->
  <line x1="749" y1="220" x2="749" y2="250" stroke="#3fb950" stroke-width="1.5" filter="url(#a-sglow)" marker-end="url(#arr-green)"/>

  <!-- Selected output box -->
  <rect x="684" y="250" width="130" height="40" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#a-sglow)"/>
  <text x="749" y="268" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">DELIVERABLE</text>
  <text x="749" y="281" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">H★ · selected output</text>

  <!-- Loop-back label inside task box -->
  <text x="450" y="335" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#484f58" text-anchor="middle">parallel k: k×base, 2k candidates, k composers, k successors · sequential k: chain k contrastive steps</text>

  <!-- ═══════════════════════════════════════════
       LOOP 2 BOX — Harnessing-Level Recursion
  ═══════════════════════════════════════════ -->
  <rect x="30" y="368" width="840" height="136" rx="10" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="50" y="360" width="210" height="20" rx="4" fill="#161b22"/>
  <text x="58" y="374" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#3fb950" font-weight="600" letter-spacing="0.5">② HARNESSING-LEVEL RECURSION</text>

  <!-- Reflector -->
  <rect x="56" y="384" width="130" height="52" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="121" y="404" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0883e" text-anchor="middle">REFLECTOR</text>
  <text x="121" y="418" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">attribution per component</text>
  <text x="121" y="428" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">HELPED · HURT · CONFOUNDED</text>

  <!-- Arrow: Reflector → Library (conditional) -->
  <line x1="186" y1="410" x2="226" y2="410" stroke="#3fb950" stroke-width="1.5" filter="url(#a-sglow)" marker-end="url(#arr-green)"/>
  <text x="206" y="404" font-family="monospace" font-size="7" fill="#3fb950" text-anchor="middle">lesson</text>

  <!-- Library Store -->
  <rect x="226" y="384" width="150" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#a-sglow)"/>
  <text x="301" y="404" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">IMPROVEMENT LIBRARY</text>
  <text x="301" y="418" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">adopted harness + EXPERIENCE.md</text>
  <text x="301" y="428" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">LanceDB index · domain/entry_###/</text>

  <!-- Arrow: Library → Retrieval -->
  <line x1="376" y1="410" x2="416" y2="410" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Retrieval -->
  <rect x="416" y="384" width="130" height="52" rx="8" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
  <text x="481" y="404" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#56d364" text-anchor="middle">RETRIEVAL</text>
  <text x="481" y="418" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">domain · task-shape · keywords</text>
  <text x="481" y="428" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">top-3 entries as editor context</text>

  <!-- Arrow: Retrieval → Editors (next task) -->
  <line x1="546" y1="410" x2="586" y2="410" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Next task starts from base note -->
  <rect x="586" y="384" width="250" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="711" y="404" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#8b949e" text-anchor="middle">NEXT TASK</text>
  <text x="711" y="418" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">always starts from harnesses/base</text>
  <text x="711" y="428" font-family="monospace" font-size="7" fill="#484f58" text-anchor="middle">library guides editors · not auto-applied</text>

  <!-- Arrow: Selected deliverable → Reflector -->
  <line x1="749" y1="290" x2="749" y2="360" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="749" y1="360" x2="186" y2="360" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="186" y1="360" x2="121" y2="384" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <text x="500" y="356" font-family="monospace" font-size="7.5" fill="#6e7681" text-anchor="middle">complete improvement record D_t</text>

</svg>
