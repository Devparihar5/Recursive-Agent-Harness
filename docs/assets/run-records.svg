<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="r-sglow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="860" height="420" fill="url(#r-bg)" rx="12"/>

  <!-- Grid -->
  <g stroke="#21262d" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="50" x2="860" y2="50"/><line x1="0" y1="100" x2="860" y2="100"/>
    <line x1="0" y1="150" x2="860" y2="150"/><line x1="0" y1="200" x2="860" y2="200"/>
    <line x1="0" y1="250" x2="860" y2="250"/><line x1="0" y1="300" x2="860" y2="300"/>
    <line x1="0" y1="350" x2="860" y2="350"/><line x1="0" y1="400" x2="860" y2="400"/>
    <line x1="86" y1="0" x2="86" y2="420"/><line x1="172" y1="0" x2="172" y2="420"/>
    <line x1="258" y1="0" x2="258" y2="420"/><line x1="344" y1="0" x2="344" y2="420"/>
    <line x1="430" y1="0" x2="430" y2="420"/><line x1="516" y1="0" x2="516" y2="420"/>
    <line x1="602" y1="0" x2="602" y2="420"/><line x1="688" y1="0" x2="688" y2="420"/>
    <line x1="774" y1="0" x2="774" y2="420"/>
  </g>

  <!-- Title -->
  <text x="430" y="30" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="1">RUN RECORDS  ·  FILESYSTEM LAYOUT</text>
  <rect x="330" y="36" width="200" height="1.5" rx="1" fill="#e3b341" opacity="0.4"/>

  <!-- Helper: directory row -->
  <!-- Folder icon macro substituted inline -->

  <!-- ═══ LEFT: runs/<task_id>/ ═══ -->
  <text x="36" y="58" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">runs/</text>
  <text x="36" y="74" font-family="monospace" font-size="9" fill="#58a6ff">  &lt;task_id&gt;/</text>

  <!-- task.json -->
  <rect x="52" y="80" width="7" height="7" rx="1" fill="#e3b341"/>
  <text x="65" y="88" font-family="monospace" font-size="8.5" fill="#e3b341">task.json</text>
  <text x="200" y="88" font-family="monospace" font-size="7.5" fill="#484f58">task definition (description, domain, sources)</text>

  <!-- pipeline.json -->
  <rect x="52" y="96" width="7" height="7" rx="1" fill="#3fb950"/>
  <text x="65" y="104" font-family="monospace" font-size="8.5" fill="#3fb950">pipeline.json</text>
  <text x="200" y="104" font-family="monospace" font-size="7.5" fill="#484f58">full result: steps, metrics, library_entry, reflection</text>

  <!-- jobs/ -->
  <text x="52" y="120" font-family="monospace" font-size="9" fill="#58a6ff">  jobs/</text>
  <rect x="68" y="126" width="7" height="7" rx="1" fill="#a5d6ff"/>
  <text x="81" y="134" font-family="monospace" font-size="8.5" fill="#a5d6ff">&lt;run_id&gt;.json</text>
  <text x="220" y="134" font-family="monospace" font-size="7.5" fill="#484f58">SSE event log · status · streamed to frontend</text>

  <!-- sources/ -->
  <text x="52" y="150" font-family="monospace" font-size="9" fill="#58a6ff">  sources/</text>
  <rect x="68" y="156" width="7" height="7" rx="1" fill="#8b949e"/>
  <text x="81" y="164" font-family="monospace" font-size="8.5" fill="#8b949e">*.md  *.pdf  *.txt</text>
  <text x="220" y="164" font-family="monospace" font-size="7.5" fill="#484f58">uploaded source files</text>

  <!-- execution dirs -->
  <text x="52" y="180" font-family="monospace" font-size="9" fill="#d2a8ff">  &lt;execution_id&gt;/</text>
  <text x="200" y="180" font-family="monospace" font-size="7" fill="#484f58">one per execution (baseline, candidate probes, successors)</text>

  <rect x="68" y="186" width="7" height="7" rx="1" fill="#e3b341"/>
  <text x="81" y="194" font-family="monospace" font-size="8.5" fill="#e3b341">task.json</text>
  <text x="200" y="194" font-family="monospace" font-size="7.5" fill="#484f58">task snapshot at execution time</text>

  <rect x="68" y="202" width="7" height="7" rx="1" fill="#3fb950"/>
  <text x="81" y="210" font-family="monospace" font-size="8.5" fill="#3fb950">deliverable.md</text>
  <text x="200" y="210" font-family="monospace" font-size="7.5" fill="#484f58">final agent output (action: final)</text>

  <rect x="68" y="218" width="7" height="7" rx="1" fill="#3fb950"/>
  <text x="81" y="226" font-family="monospace" font-size="8.5" fill="#3fb950">execution.json</text>
  <text x="200" y="226" font-family="monospace" font-size="7.5" fill="#484f58">full ExecutionRecord: status, token_usage, tool_calls, trajectory</text>

  <rect x="68" y="234" width="7" height="7" rx="1" fill="#58a6ff"/>
  <text x="81" y="242" font-family="monospace" font-size="8.5" fill="#58a6ff">trajectory.json</text>
  <text x="200" y="242" font-family="monospace" font-size="7.5" fill="#484f58">every model request, response, tool call, error</text>

  <rect x="68" y="250" width="7" height="7" rx="1" fill="#58a6ff"/>
  <text x="81" y="258" font-family="monospace" font-size="8.5" fill="#58a6ff">tool_calls.json</text>
  <text x="200" y="258" font-family="monospace" font-size="7.5" fill="#484f58">tool calls only (action, result, error, step)</text>

  <rect x="68" y="266" width="7" height="7" rx="1" fill="#8b949e"/>
  <text x="81" y="274" font-family="monospace" font-size="8.5" fill="#8b949e">metadata.json</text>
  <text x="200" y="274" font-family="monospace" font-size="7.5" fill="#484f58">status, timing, token_usage, harness_version, model</text>

  <!-- harness/ sub-dir -->
  <text x="68" y="290" font-family="monospace" font-size="8.5" fill="#f78166">    harness/</text>
  <text x="200" y="290" font-family="monospace" font-size="7.5" fill="#484f58">exact harness snapshot — C1–C8 files</text>
  <text x="84" y="302" font-family="monospace" font-size="7.5" fill="#484f58">systemprompt.md  guardrails.md  LongTermMEMORY.md  tool_guidance.md  …</text>

  <!-- workspace/ sub-dir -->
  <text x="68" y="318" font-family="monospace" font-size="8.5" fill="#f78166">    workspace/</text>
  <text x="200" y="318" font-family="monospace" font-size="7.5" fill="#484f58">sandbox — sources copied in, agent writes to output/</text>
  <text x="84" y="330" font-family="monospace" font-size="7.5" fill="#484f58">order.md  account.md  …   output/result.md  output/analysis.md  …</text>

  <!-- ═══ RIGHT: improvement_library/ ═══ -->
  <line x1="512" y1="56" x2="512" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="528" y="58" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">improvement_library/</text>
  <text x="528" y="74" font-family="monospace" font-size="9" fill="#3fb950">  &lt;domain&gt;/</text>
  <text x="528" y="90" font-family="monospace" font-size="9" fill="#3fb950">    entry_001/</text>

  <rect x="544" y="96" width="7" height="7" rx="1" fill="#3fb950"/>
  <text x="557" y="104" font-family="monospace" font-size="8.5" fill="#3fb950">EXPERIENCE.md</text>
  <text x="700" y="104" font-family="monospace" font-size="7.5" fill="#484f58">cue · lesson · evidence · attributions</text>

  <text x="544" y="120" font-family="monospace" font-size="8.5" fill="#f78166">      harness/</text>
  <text x="700" y="120" font-family="monospace" font-size="7.5" fill="#484f58">full C1–C8 snapshot</text>
  <text x="560" y="132" font-family="monospace" font-size="7.5" fill="#484f58">systemprompt.md  guardrails.md  LongTermMEMORY.md</text>
  <text x="560" y="144" font-family="monospace" font-size="7.5" fill="#484f58">tool_guidance.md  skills/  scripts/  …</text>

  <!-- EXPERIENCE.md contents -->
  <rect x="528" y="156" width="308" height="112" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="682" y="174" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="600" fill="#8b949e" text-anchor="middle">EXPERIENCE.md  structure</text>
  <text x="544" y="191" font-family="monospace" font-size="7.5" fill="#e3b341">cue:</text>
  <text x="600" y="191" font-family="monospace" font-size="7.5" fill="#8b949e">when is this experience applicable</text>
  <text x="544" y="205" font-family="monospace" font-size="7.5" fill="#e3b341">lesson:</text>
  <text x="600" y="205" font-family="monospace" font-size="7.5" fill="#8b949e">what the change did, concretely</text>
  <text x="544" y="219" font-family="monospace" font-size="7.5" fill="#e3b341">evidence:</text>
  <text x="600" y="219" font-family="monospace" font-size="7.5" fill="#8b949e">quoted probe observation string</text>
  <text x="544" y="233" font-family="monospace" font-size="7.5" fill="#e3b341">attributions:</text>
  <text x="620" y="233" font-family="monospace" font-size="7.5" fill="#8b949e">component · verdict · candidate</text>
  <text x="544" y="247" font-family="monospace" font-size="7.5" fill="#e3b341">confidence:</text>
  <text x="620" y="247" font-family="monospace" font-size="7.5" fill="#8b949e">low / medium / high</text>
  <text x="544" y="261" font-family="monospace" font-size="7.5" fill="#484f58">written by Reflector · conditions: lesson ≠ NO_ENTRY + harness changed</text>

  <!-- Index -->
  <rect x="544" y="278" width="7" height="7" rx="1" fill="#a5d6ff"/>
  <text x="557" y="286" font-family="monospace" font-size="8.5" fill="#a5d6ff">INDEX.json</text>
  <text x="700" y="286" font-family="monospace" font-size="7.5" fill="#484f58">all entries for this domain</text>

  <rect x="544" y="294" width="7" height="7" rx="1" fill="#a5d6ff"/>
  <text x="557" y="302" font-family="monospace" font-size="8.5" fill="#a5d6ff">index.lancedb/</text>
  <text x="700" y="302" font-family="monospace" font-size="7.5" fill="#484f58">LanceDB metadata index (id + JSON blob per entry)</text>

  <!-- retrieval note -->
  <rect x="528" y="314" width="308" height="44" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1" opacity="0.7"/>
  <text x="682" y="331" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#3fb950" text-anchor="middle" font-weight="600">RETRIEVAL  (library/retrieval.py)</text>
  <text x="682" y="346" font-family="monospace" font-size="7.5" fill="#8b949e" text-anchor="middle">rank by: domain match +10 · task_shape +6 · component overlap +4 · keywords +1</text>
  <text x="682" y="358" font-family="monospace" font-size="7.5" fill="#484f58" text-anchor="middle">returns top-3 entries as context for editors · harness never auto-applied</text>

  <!-- Footer -->
  <text x="430" y="408" font-family="monospace" font-size="7.5" fill="#484f58" text-anchor="middle">All paths use safe_path() guard · no symlinks · no path escape · atomic JSON writes via .tmp replace</text>
</svg>
