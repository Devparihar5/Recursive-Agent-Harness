<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="p-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="p-sglow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="p-arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#484f58"/>
    </marker>
    <marker id="p-arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3fb950"/>
    </marker>
    <marker id="p-arr-b" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="p-arr-y" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#e3b341"/>
    </marker>
    <marker id="p-arr-r" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f78166"/>
    </marker>
    <marker id="p-arr-p" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#d2a8ff"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="960" height="480" fill="url(#p-bg)" rx="12"/>

  <!-- Grid -->
  <g stroke="#21262d" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="48" x2="960" y2="48"/><line x1="0" y1="96" x2="960" y2="96"/>
    <line x1="0" y1="144" x2="960" y2="144"/><line x1="0" y1="192" x2="960" y2="192"/>
    <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="288" x2="960" y2="288"/>
    <line x1="0" y1="336" x2="960" y2="336"/><line x1="0" y1="384" x2="960" y2="384"/>
    <line x1="0" y1="432" x2="960" y2="432"/>
    <line x1="96" y1="0" x2="96" y2="480"/><line x1="192" y1="0" x2="192" y2="480"/>
    <line x1="288" y1="0" x2="288" y2="480"/><line x1="384" y1="0" x2="384" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="576" y1="0" x2="576" y2="480"/>
    <line x1="672" y1="0" x2="672" y2="480"/><line x1="768" y1="0" x2="768" y2="480"/>
    <line x1="864" y1="0" x2="864" y2="480"/>
  </g>

  <!-- Title -->
  <text x="480" y="30" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="1">PARALLEL RECURSION  ·  k = 3</text>
  <rect x="380" y="36" width="200" height="1.5" rx="1" fill="#58a6ff" opacity="0.4"/>

  <!-- Column labels -->
  <text x="60"  y="56" font-family="monospace" font-size="8" fill="#484f58" text-anchor="middle">INPUT</text>
  <text x="165" y="56" font-family="monospace" font-size="8" fill="#58a6ff" text-anchor="middle">k BASELINES</text>
  <text x="310" y="56" font-family="monospace" font-size="8" fill="#e3b341" text-anchor="middle">2k CANDIDATES</text>
  <text x="480" y="56" font-family="monospace" font-size="8" fill="#a5d6ff" text-anchor="middle">FULL PROBE POOL</text>
  <text x="640" y="56" font-family="monospace" font-size="8" fill="#d2a8ff" text-anchor="middle">k COMPOSERS</text>
  <text x="790" y="56" font-family="monospace" font-size="8" fill="#58a6ff" text-anchor="middle">k SUCCESSORS</text>
  <text x="920" y="56" font-family="monospace" font-size="8" fill="#3fb950" text-anchor="middle">SELECT</text>

  <!-- Vertical dividers -->
  <line x1="105" y1="60" x2="105" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="230" y1="60" x2="230" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="60" x2="400" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="560" y1="60" x2="560" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="720" y1="60" x2="720" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="850" y1="60" x2="850" y2="456" stroke="#21262d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ─── Task + Base Harness ─── -->
  <rect x="20" y="210" width="80" height="44" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#p-sglow)"/>
  <text x="60" y="230" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" fill="#3fb950" text-anchor="middle">TASK</text>
  <text x="60" y="244" font-family="monospace" font-size="7" fill="#8b949e" text-anchor="middle">+ harnesses/base</text>

  <!-- Arrows: Task → 3 baselines -->
  <line x1="100" y1="222" x2="120" y2="136" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="100" y1="232" x2="120" y2="232" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="100" y1="242" x2="120" y2="328" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>

  <!-- ─── 3 Baseline Executors ─── -->
  <!-- Branch 1 (y=110) -->
  <rect x="120" y="110" width="108" height="44" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="174" y="128" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">EXECUTOR 1</text>
  <text x="174" y="141" font-family="monospace" font-size="7" fill="#8b949e" text-anchor="middle">baseline e₀¹</text>

  <!-- Branch 2 (y=210) -->
  <rect x="120" y="210" width="108" height="44" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="174" y="228" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">EXECUTOR 2</text>
  <text x="174" y="241" font-family="monospace" font-size="7" fill="#8b949e" text-anchor="middle">baseline e₀²</text>

  <!-- Branch 3 (y=310) -->
  <rect x="120" y="310" width="108" height="44" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="174" y="328" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">EXECUTOR 3</text>
  <text x="174" y="341" font-family="monospace" font-size="7" fill="#8b949e" text-anchor="middle">baseline e₀³</text>

  <!-- ─── 6 Candidates (INV/DOM per branch) ─── -->
  <!-- Branch 1 -->
  <line x1="228" y1="132" x2="246" y2="108" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="228" y1="132" x2="246" y2="148" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <rect x="246" y="88" width="92" height="36" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.2"/>
  <text x="292" y="105" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#e3b341" text-anchor="middle">INV-1</text>
  <text x="292" y="117" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">invariant candidate</text>
  <rect x="246" y="132" width="92" height="36" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.2"/>
  <text x="292" y="149" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#f78166" text-anchor="middle">DOM-1</text>
  <text x="292" y="161" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">domain candidate</text>

  <!-- Branch 2 -->
  <line x1="228" y1="232" x2="246" y2="208" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="228" y1="232" x2="246" y2="248" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <rect x="246" y="188" width="92" height="36" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.2"/>
  <text x="292" y="205" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#e3b341" text-anchor="middle">INV-2</text>
  <text x="292" y="217" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">invariant candidate</text>
  <rect x="246" y="232" width="92" height="36" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.2"/>
  <text x="292" y="249" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#f78166" text-anchor="middle">DOM-2</text>
  <text x="292" y="261" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">domain candidate</text>

  <!-- Branch 3 -->
  <line x1="228" y1="332" x2="246" y2="308" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="228" y1="332" x2="246" y2="348" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <rect x="246" y="288" width="92" height="36" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.2"/>
  <text x="292" y="305" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#e3b341" text-anchor="middle">INV-3</text>
  <text x="292" y="317" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">invariant candidate</text>
  <rect x="246" y="332" width="92" height="36" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1.2"/>
  <text x="292" y="349" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#f78166" text-anchor="middle">DOM-3</text>
  <text x="292" y="361" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">domain candidate</text>

  <!-- ─── Probe Pool ─── -->
  <!-- All candidates probe → pool box -->
  <line x1="338" y1="106" x2="418" y2="200" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="338" y1="150" x2="418" y2="210" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="338" y1="206" x2="418" y2="222" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="338" y1="250" x2="418" y2="232" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="338" y1="306" x2="418" y2="242" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="338" y1="350" x2="418" y2="252" stroke="#484f58" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Baselines also feed pool -->
  <line x1="228" y1="122" x2="418" y2="196" stroke="#484f58" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="228" y1="222" x2="418" y2="220" stroke="#484f58" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="228" y1="322" x2="418" y2="244" stroke="#484f58" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <rect x="418" y="186" width="140" height="80" rx="8" fill="#161b22" stroke="#a5d6ff" stroke-width="1.5"/>
  <text x="488" y="208" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" fill="#a5d6ff" text-anchor="middle">FULL PROBE POOL</text>
  <text x="488" y="222" font-family="monospace" font-size="7" fill="#8b949e" text-anchor="middle">3 baselines + 6 candidates</text>
  <text x="488" y="234" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">behavioral evidence strings</text>
  <text x="488" y="248" font-family="monospace" font-size="7" fill="#6e7681" text-anchor="middle">trajectory · tool calls · output</text>

  <!-- ─── 3 Composers ─── -->
  <line x1="558" y1="210" x2="578" y2="148" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="558" y1="226" x2="578" y2="248" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="558" y1="240" x2="578" y2="348" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>

  <rect x="578" y="118" width="110" height="48" rx="7" fill="#161b22" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="633" y="138" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#d2a8ff" text-anchor="middle">COMPOSER 1</text>
  <text x="633" y="152" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">sees full pool · H′₁</text>

  <rect x="578" y="218" width="110" height="48" rx="7" fill="#161b22" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="633" y="238" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#d2a8ff" text-anchor="middle">COMPOSER 2</text>
  <text x="633" y="252" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">sees full pool · H′₂</text>

  <rect x="578" y="318" width="110" height="48" rx="7" fill="#161b22" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="633" y="338" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#d2a8ff" text-anchor="middle">COMPOSER 3</text>
  <text x="633" y="352" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">sees full pool · H′₃</text>

  <!-- ─── 3 Successor Executors ─── -->
  <line x1="688" y1="142" x2="726" y2="142" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="688" y1="242" x2="726" y2="242" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <line x1="688" y1="342" x2="726" y2="342" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr)"/>

  <rect x="726" y="118" width="120" height="48" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="786" y="138" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">SUCCESSOR 1</text>
  <text x="786" y="152" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">e′₁ · deliverable₁</text>

  <rect x="726" y="218" width="120" height="48" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="786" y="238" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">SUCCESSOR 2</text>
  <text x="786" y="252" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">e′₂ · deliverable₂</text>

  <rect x="726" y="318" width="120" height="48" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="786" y="338" font-family="'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#58a6ff" text-anchor="middle">SUCCESSOR 3</text>
  <text x="786" y="352" font-family="monospace" font-size="6.5" fill="#8b949e" text-anchor="middle">e′₃ · deliverable₃</text>

  <!-- ─── Blind Selector ─── -->
  <line x1="846" y1="142" x2="890" y2="210" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr-g)"/>
  <line x1="846" y1="242" x2="890" y2="224" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr-g)"/>
  <line x1="846" y1="342" x2="890" y2="238" stroke="#484f58" stroke-width="1.2" marker-end="url(#p-arr-g)"/>

  <rect x="890" y="192" width="58" height="64" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#p-sglow)"/>
  <text x="919" y="215" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-weight="700" fill="#3fb950" text-anchor="middle">BLIND</text>
  <text x="919" y="227" font-family="'Segoe UI',system-ui,sans-serif" font-size="7.5" font-weight="700" fill="#3fb950" text-anchor="middle">SELECT</text>
  <text x="919" y="241" font-family="monospace" font-size="6" fill="#8b949e" text-anchor="middle">anonymous</text>
  <text x="919" y="251" font-family="monospace" font-size="6" fill="#8b949e" text-anchor="middle">H★</text>

  <!-- Count annotation -->
  <text x="480" y="440" font-family="monospace" font-size="8" fill="#484f58" text-anchor="middle">Total executions:  k base  +  2k candidate probes  +  k successor probes  =  6k  →  k=3 gives 18 executions</text>
  <text x="480" y="458" font-family="monospace" font-size="8" fill="#484f58" text-anchor="middle">All composers run independently and concurrently on the same evidence pool</text>
</svg>
