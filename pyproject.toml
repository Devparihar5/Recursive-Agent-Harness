[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-agent-harness"
version = "0.1.0"
description = "Contrastive recursive improvement of filesystem agent harnesses"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "lancedb>=0.20,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
recursive-agent-harness = "app.__main__:main"

[tool.poetry]
packages = [{ include = "app" }]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
